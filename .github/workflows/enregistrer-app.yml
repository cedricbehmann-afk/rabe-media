# Enregistre l'app Assistant Rabe en vrai (assistant-rabe.com, iPhone émulé) pour les posts
# « utilisation de l'app » : vraie question tapée, vraie réponse du serveur, en-tête « En ligne ».
# Se lance quand un fichier de demandes est poussé dans enregistrements/demandes/,
# et pousse les vidéos d'écran dans enregistrements/sorties/<nom du fichier>/.
name: Enregistrer l'app

on:
  push:
    branches: [main]
    paths: ['enregistrements/demandes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enregistrer-app
  cancel-in-progress: false

jobs:
  enregistrer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          cd enregistrements && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Enregistrer
        run: |
          cd enregistrements
          for f in $(git diff --relative --name-only HEAD~1 HEAD -- demandes/ 2>/dev/null; [ "${{ github.event_name }}" = "workflow_dispatch" ] && ls demandes/*.json); do
            [ -f "$f" ] || continue
            n=$(basename "$f" .json)
            node enregistrer.cjs "$f" "sorties/$n"
          done
      - name: Pousser les vidéos
        run: |
          git config user.name "Claude" && git config user.email "noreply@anthropic.com"
          [ -d enregistrements/sorties ] || { echo "Aucune vidéo produite"; exit 1; }
          git add enregistrements/sorties
          git diff --cached --quiet && exit 0
          git commit -m "Enregistrements de l'app [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
